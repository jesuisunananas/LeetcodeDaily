name: Retry Failed Daily Leetcode Workflow

on:
    workflow_run:
        workflows: ["Send Daily Leetcode Problems"]
        types: [completed]

permissions:
    actions: write

jobs:
    retry-failed-run:
        if: >-
            ${{ github.event.workflow_run.conclusion == 'failure' &&
            github.event.workflow_run.run_attempt < 3 }}
        runs-on: ubuntu-latest
        steps:
            - name: Wait before retrying
              env:
                  RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
              run: |
                  delay_seconds=$((300 * (2 ** (RUN_ATTEMPT - 1))))
                  echo "Retrying in ${delay_seconds} seconds"
                  sleep "${delay_seconds}"

            - name: Rerun failed jobs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPOSITORY: ${{ github.repository }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
              run: |
                  gh api --method POST \
                    "repos/${REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
